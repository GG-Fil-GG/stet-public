# Stet - Project Configuration
# This file configures static analysis tools for code quality

[project]
name = "stet"
version = "2.0.0"
description = "AI-powered tool for addressing reviewer comments in Word manuscripts"
readme = "README.md"
requires-python = ">=3.10"

# =============================================================================
# MYPY - Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true  # Gradual adoption - don't fail on untyped libraries

# Exclude archived and test files from strict checking
exclude = [
    "_archive/",
    "tests/",
]

# Per-module overrides for gradual adoption
[[tool.mypy.overrides]]
module = [
    "src.llm_handler",
]
# These modules are complex - start with less strict checking
warn_return_any = false

# =============================================================================
# PYTEST - Testing
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "_archive/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# =============================================================================
# RADON - Complexity Metrics
# =============================================================================
# Run with: radon cc src/ -a -s
# Thresholds:
#   A (1-5): Low complexity - good
#   B (6-10): Moderate - acceptable
#   C (11-20): High - consider refactoring
#   D (21-30): Very high - refactor
#   E (31-40): Alarming
#   F (41+): Unmaintainable

# =============================================================================
# FLAKE8 - Linting
# =============================================================================
# Note: flake8 doesn't support pyproject.toml natively.
# Configuration is in .flake8 file or setup.cfg
# We use setup.cfg for flake8 config (see below)
