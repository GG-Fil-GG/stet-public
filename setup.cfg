# Flake8 Configuration
# Run with: flake8 src/ main.py

[flake8]
max-line-length = 120
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info

# Ignore certain errors for pragmatic reasons:
# E501: Line too long (we set max to 120, but some lines are documentation)
# W503: Line break before binary operator (conflicts with black)
# E203: Whitespace before ':' (conflicts with black)
ignore = W503, E203

# Per-file ignores
per-file-ignores =
    # Tests can have longer lines and unused imports for fixtures
    tests/*:E501,F401
    # Main.py has some complex endpoint definitions
    main.py:E501
